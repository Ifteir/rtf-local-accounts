{% extends "base.html" %}{% block content %}<h1>Settings</h1><section class="panel"><h2>Change password</h2><form method="post"><label>Current password<input type="password" name="old_password" autocomplete="current-password" required></label><label>New password (minimum 8 characters)<input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input type="password" name="confirm_new_password" autocomplete="new-password" minlength="8" required></label><button>Update password</button></form></section><p class="muted">The database is stored locally in accounts.db in the project folder. Back it up regularly.</p>{% endblock %}
