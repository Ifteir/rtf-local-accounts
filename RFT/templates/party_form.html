{% extends "base.html" %}{% block content %}<h1>{{'Edit' if party else 'Add'}} {{kind|title}}</h1><form class="panel formgrid" method="post"><label>Name *<input name="name" required value="{{party.name if party else ''}}"></label><label>Company<input name="company" value="{{party.company if party else ''}}"></label><label>Phone<input name="phone" value="{{party.phone if party else ''}}"></label><label>Ledger/page no.<input name="page_no" value="{{party.page_no if party else ''}}"></label><label class="wide">Address<textarea name="address">{{party.address if party else ''}}</textarea></label><label class="wide">Notes<textarea name="notes">{{party.notes if party else ''}}</textarea></label><div class="wide"><button>Save</button> <a class="button secondary" href="{{url_for('parties',kind=kind)}}">Cancel</a></div></form>{% endblock %}
